<div class="auth-split">
  <!-- Cabecera de marca solo para móvil (coincide con el login) -->
  <div class="m-brand-header">
    <div class="brand-logo-row">
      <div class="logo-chip"><vx-mark [size]="22" variant="white" /></div>
      <span>Vexcel</span>
    </div>
  </div>

  <div class="form-pane">
    <form class="form-box" style="max-width:370px" (ngSubmit)="submit()">
      <div class="reg-inline-logo" style="display:flex;align-items:center;gap:10px;margin-bottom:26px">
        <vx-mark [size]="24" />
        <span style="font-size:18px;font-weight:700;color:#141418;letter-spacing:-0.02em">Vexcel</span>
      </div>
      <div class="auth-title">Crea tu cuenta</div>
      <div class="auth-sub">Empieza gratis, sin tarjeta.</div>

      <vx-google-button style="display:block;margin-top:26px" label="Registrarse con Google" />

      <div class="divider"><div class="line"></div><span>o con tu correo</span><div class="line"></div></div>

      <div class="fields" style="gap:14px">
        <div>
          <div class="field-label">Nombre</div>
          <div class="field-wrap">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8E8EA0" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21a8 8 0 0 1 16 0" />
            </svg>
            <input #nameEl class="input" name="name" [(ngModel)]="name" placeholder="Tu nombre" autocomplete="name" />
          </div>
        </div>
        <div>
          <div class="field-label">Correo</div>
          <div class="field-wrap">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8E8EA0" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="3" />
              <path d="m2 7 10 6 10-6" />
            </svg>
            <input #emailEl class="input" name="email" [(ngModel)]="email" placeholder="tu@correo.com"
              spellcheck="false" autocomplete="email" />
          </div>
        </div>
        <div>
          <div class="field-label">Contraseña</div>
          <div class="field-wrap">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8E8EA0" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="11" width="16" height="10" rx="2.5" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
            <input #passEl class="input" name="pass" [(ngModel)]="pass" type="password"
              placeholder="Mínimo 8 caracteres" autocomplete="new-password" />
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        @if (busy()) {
          <span class="spin"></span>
        } @else {
          <span>Crear cuenta gratis</span>
        }
      </button>

      <div class="switch-line">
        ¿Ya tienes cuenta?
        <button type="button" routerLink="/login">Inicia sesión</button>
      </div>
    </form>
  </div>

  <div class="brand-pane brand-pane-register">
    <div class="brand-deco">
      <div style="position:absolute;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.08);top:-110px;right:-90px;animation:vx-drift 11s ease-in-out infinite"></div>
      <div style="position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06);bottom:-70px;left:-50px;animation:vx-drift 13s ease-in-out infinite reverse"></div>
      <div style="position:absolute;top:20%;right:18%;width:50px;height:50px;border-radius:15px;background:rgba(255,255,255,.1);animation:vx-float2 8s ease-in-out infinite"></div>
    </div>
    <div style="position:relative;z-index:1">
      <div style="font-size:26px;font-weight:700;color:#fff;line-height:1.24;letter-spacing:-0.02em;max-width:330px">
        Todo lo que necesitas para vectorizar, gratis.
      </div>
      <div class="benefits">
        @for (b of benefits; track b.title) {
          <div class="benefit">
            <div class="benefit-check">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </div>
            <div>
              <div class="benefit-title">{{ b.title }}</div>
              <div class="benefit-desc">{{ b.desc }}</div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
